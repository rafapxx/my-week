<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Неделя">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Моя неделя</title>
<style>
:root{
  --bg:#000; --line:#1f1f1f; --line-h:#2c2c2c; --fg:#f2f2f2; --muted:#7c7c7c; --dim:#4a4a4a; --field:#0e0e0e;
  --ev:#1b1b1b; --ev-b:#3a3a3a; --now:#e5484d;
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;
  --h:48px; --tc:44px; --lab:34px; --topH:60px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);overflow-anchor:none}
body{color:var(--fg);font-family:var(--f);font-size:14px;line-height:1.35;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:1px solid var(--fg);outline-offset:2px}
[hidden]{display:none!important}
.app{max-width:1400px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left));padding-bottom:calc(40px + env(safe-area-inset-bottom))}

.top{position:sticky;top:0;z-index:6;background:var(--bg);padding-top:calc(12px + env(safe-area-inset-top));border-bottom:1px solid var(--line-h)}
.bar{display:flex;align-items:center;gap:12px;padding-bottom:10px}
.range{font-size:1rem;font-weight:500;font-variant-numeric:tabular-nums}
.dot{width:6px;height:6px;border-radius:50%;background:var(--dim);flex:none}
.dot[data-s="live"]{background:var(--fg)}
.dot[data-s="off"]{background:var(--now)}
.nav{margin-left:auto;display:flex;gap:2px}
.nav button{min-width:36px;height:36px;padding:0 10px;color:var(--muted);border-radius:8px}
.nav button:hover{color:var(--fg);background:var(--field)}
.tabs{display:none;grid-template-columns:repeat(7,1fr);gap:2px;padding-bottom:8px}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:8px;color:var(--muted);font-size:.72rem}
.tab b{font-weight:500;font-size:1rem;color:var(--fg);font-variant-numeric:tabular-nums}
.tab.sel{background:var(--fg);color:var(--bg)}
.tab.sel b{color:var(--bg)}
.tab.today:not(.sel) b{color:var(--now)}

.times{position:relative}
.times span{position:absolute;right:8px;transform:translateY(-50%);font-size:.68rem;color:var(--muted);font-variant-numeric:tabular-nums}
.col{position:relative;height:calc(var(--h) * 24);border-left:1px solid var(--line);cursor:cell;
  background-image:linear-gradient(var(--line-h) 1px,transparent 1px),linear-gradient(var(--line) 1px,transparent 1px);
  background-size:100% var(--h),100% calc(var(--h) / 2)}
.col.today{background-color:#070707}
.now{position:absolute;left:-1px;right:0;height:2px;background:var(--now);z-index:2;pointer-events:none}
.now::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--now)}
.ev{position:absolute;z-index:1;padding:3px 6px;border-radius:6px;background:var(--ev);border:1px solid var(--ev-b);overflow:hidden;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:1px;min-width:0}
.ev:hover{border-color:var(--muted)}
.ev .t{font-size:.68rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.ev .n{font-size:.8rem;overflow-wrap:anywhere}
.ev.short{flex-direction:row;align-items:baseline;gap:6px}
.ev.short .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.done{opacity:.45}
.ev.done .n{text-decoration:line-through}
.ev .ck{position:absolute;top:4px;right:4px;width:12px;height:12px;border-radius:50%;box-shadow:inset 0 0 0 1px var(--muted)}
.ev.done .ck{background:var(--fg);box-shadow:none}
.ev .n,.ev .t{padding-right:14px}
.allday{flex:none;font-size:.75rem;background:var(--ev);border-left:2px solid var(--muted);border-radius:4px;padding:2px 6px;text-align:left;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.allday.done{opacity:.45;text-decoration:line-through}

.wk-head,.wk-body{display:grid;grid-template-columns:var(--tc) repeat(7,minmax(0,1fr))}
.wk-head{position:sticky;top:var(--topH);z-index:4;background:var(--bg);border-bottom:1px solid var(--line-h)}
.hc{padding:8px 6px 6px;border-left:1px solid var(--line);min-width:0;display:flex;flex-direction:column;gap:4px}
.hd{display:flex;align-items:baseline;gap:6px;color:var(--muted);font-size:.75rem}
.hd b{font-weight:500;font-size:1.05rem;color:var(--fg);font-variant-numeric:tabular-nums}
.hc.today .hd b{color:var(--now)}

.day{display:grid;grid-template-columns:var(--tc) minmax(0,1fr)}
.lab{grid-column:1/-1;height:var(--lab);display:flex;align-items:center;gap:8px;border-top:1px solid var(--line-h);overflow-x:auto;scrollbar-width:none;color:var(--muted);font-size:.75rem;white-space:nowrap}
.lab::-webkit-scrollbar{display:none}
.lab b{color:var(--fg);font-weight:500;font-size:.9rem}
.day.today .lab b{color:var(--now)}
.foot{padding:24px 0;text-align:center}
.foot button{color:var(--dim);font-size:.75rem}

.back{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{width:100%;max-width:440px;background:#111;border-radius:14px 14px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
@media (min-width:701px){.back{align-items:center}.sheet{border-radius:14px}}
input,select{font:inherit;font-size:16px;color:var(--fg);background:var(--field);border:1px solid var(--line-h);border-radius:8px;padding:10px 12px;width:100%;min-width:0}
input:focus,select:focus{outline:none;border-color:var(--muted)}
input::-webkit-calendar-picker-indicator{filter:invert(1);opacity:.5}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hint{font-size:.72rem;color:var(--muted);margin-top:-4px}

/* "+" button */
.fab{position:fixed;right:max(20px,env(safe-area-inset-right));bottom:calc(20px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;background:var(--fg);color:var(--bg);padding:0;z-index:8;box-shadow:0 6px 20px rgba(0,0,0,.6);display:grid;place-items:center}
.fab svg{display:block}
.fab:active{transform:scale(.95)}

/* editor fields: tap = wheel, tap again = keyboard */
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld span{font-size:.7rem;color:var(--muted)}
.fld input{font-variant-numeric:tabular-nums;cursor:pointer}
.fld input.act{border-color:var(--fg)}
.fld input:not([readonly]){cursor:text;background:#000}
.sw{display:flex;align-items:center;justify-content:space-between;font-size:.9rem;padding:2px 0}
.sw input{appearance:none;-webkit-appearance:none;width:44px;height:26px;border-radius:13px;background:var(--line-h);position:relative;padding:0;border:0;cursor:pointer;flex:none;transition:background .15s}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--fg);transition:transform .15s}
.sw input:checked{background:var(--fg)}
.sw input:checked::after{background:var(--bg);transform:translateX(18px)}

/* wheel picker */
.picker{position:relative;display:flex;justify-content:center;align-items:center;gap:2px;height:180px;user-select:none;-webkit-user-select:none}
.picker::before{content:"";position:absolute;left:0;right:0;top:72px;height:36px;background:var(--field);border:1px solid var(--line-h);border-radius:8px;pointer-events:none}
.wheel{position:relative;height:180px;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;flex:1 1 0;min-width:0;padding-block:72px;overscroll-behavior:contain;
  -webkit-mask-image:linear-gradient(transparent,#000 35%,#000 65%,transparent);mask-image:linear-gradient(transparent,#000 35%,#000 65%,transparent)}
.wheel::-webkit-scrollbar{display:none}
.wheel.h div{text-align:right;padding-right:14px}
.wheel.m div{text-align:left;padding-left:14px}
.wheel div{height:36px;line-height:36px;text-align:center;scroll-snap-align:center;font-size:1.1rem;font-variant-numeric:tabular-nums;cursor:pointer}
.picker .colon{position:relative;flex:none;font-size:1.1rem;color:var(--muted)}
.acts{display:flex;align-items:center;gap:16px}
.acts .link{color:var(--muted);font-size:.85rem}
.acts .link:hover{color:var(--fg)}
.save{margin-left:auto;background:var(--fg);color:var(--bg);border-radius:8px;padding:10px 18px;font-weight:500}

.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.login form{width:100%;max-width:340px;display:flex;flex-direction:column;gap:12px}
.login h1{font-weight:500;font-size:1.4rem;margin:0 0 8px}
.login .err{color:var(--now);font-size:.8rem;min-height:1em}
.login .save{margin-left:0}
.boot{min-height:100vh;display:grid;place-items:center;color:var(--dim)}


/* ---- white neon layer ---- */
:root{--neon:#fff;--glow:0 0 6px rgba(255,255,255,.8),0 0 18px rgba(255,255,255,.35)}
.tab.sel{background:var(--neon);box-shadow:var(--glow)}
.tab.today:not(.sel) b,.hc.today .hd b,.day.today .lab b{color:var(--neon);text-shadow:var(--glow);text-decoration:none}
.dot[data-s="live"]{background:var(--neon);box-shadow:var(--glow)}
.now{background:var(--neon);box-shadow:0 0 6px #fff,0 0 16px rgba(255,255,255,.6)}
.now::before{background:var(--now);box-shadow:0 0 8px var(--now),0 0 16px var(--now)}
.ev{border-color:rgba(255,255,255,.3);box-shadow:inset 0 0 10px rgba(255,255,255,.05)}
.ev:hover{border-color:var(--neon);box-shadow:var(--glow)}
.ev.done .ck{box-shadow:0 0 6px #fff}
.fab{background:var(--neon);box-shadow:0 0 12px rgba(255,255,255,.7),0 0 36px rgba(255,255,255,.3)}
.save{box-shadow:0 0 12px rgba(255,255,255,.4)}
.picker::before{border-color:rgba(255,255,255,.45);box-shadow:0 0 12px rgba(255,255,255,.18)}
.fld input.act{border-color:var(--neon);box-shadow:0 0 10px rgba(255,255,255,.3)}
.sw input:checked{background:var(--neon);box-shadow:var(--glow)}
@media (max-width:700px){
  .tabs{display:grid}
  :root{--h:56px;--tc:40px}
}
</style>
</head>
<body>
<div class="boot" id="boot">Загружаю…</div>

<div class="login" id="login" hidden>
  <form id="lf">
    <h1>Моя неделя</h1>
    <input id="l-email" type="email" autocomplete="username" placeholder="Почта" required>
    <input id="l-pass" type="password" autocomplete="current-password" placeholder="Пароль" required>
    <div class="err" id="l-err"></div>
    <button type="submit" class="save">Войти</button>
  </form>
</div>

<div class="app" id="app" hidden>
  <div class="top" id="top">
    <div class="bar">
      <span class="dot" id="dot" title="Подключаюсь"></span>
      <span class="range" id="range"></span>
      <div class="nav">
        <button id="prev" aria-label="Предыдущая неделя">←</button>
        <button id="now">Сегодня</button>
        <button id="next" aria-label="Следующая неделя">→</button>
      </div>
    </div>
    <div class="tabs" id="tabs"></div>
  </div>
  <div id="view"></div>
  <div class="foot" style="padding-bottom:64px"><button id="logout">Выйти</button></div>
</div>
<button class="fab" id="fab" aria-label="Добавить дело" hidden><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M12 4v16M4 12h16" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg></button>
<div id="modal"></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
import {initializeFirestore,persistentLocalCache,persistentMultipleTabManager,doc,onSnapshot,setDoc,arrayUnion} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

const firebaseConfig={
  apiKey:"AIzaSyCS-a6ROL_7dvV9VxabCHjqT1R4e8bkT9w",
  authDomain:"timetablerafael.firebaseapp.com",
  projectId:"timetablerafael",
  storageBucket:"timetablerafael.firebasestorage.app",
  messagingSenderId:"830920379530",
  appId:"1:830920379530:web:941eb5b8a83fee6370f173"
};
const fbApp=initializeApp(firebaseConfig);
const auth=getAuth(fbApp);
const fs=initializeFirestore(fbApp,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})});

const DAYS=["Пн","Вт","Ср","Чт","Пт","Сб","Вс"];
const MON=["янв","фев","мар","апр","мая","июн","июл","авг","сен","окт","ноя","дек"];
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const toMin=t=>{if(!t)return null;const[a,b]=t.split(":");return +a*60+ +b};
const fmt=m=>pad(Math.floor(m/60))+":"+pad(m%60);
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
function monday(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-(x.getDay()+6)%7);return x}
const mq=matchMedia("(max-width:700px)");
const cssPx=v=>parseFloat(getComputedStyle(document.documentElement).getPropertyValue(v))||0;

let uid=null;
const weeks=new Map();
let weekStart=monday(new Date());
let rangeStart=addDays(weekStart,-7),rangeLen=3;
let visible={k:iso(weekStart),d:(new Date().getDay()+6)%7};

/* ---------- storage: users/{uid}/weeks/{monday} ---------- */
function syncState(){
  const pending=[...weeks.values()].some(w=>w.pending);
  if(!navigator.onLine)return setDot("off","Офлайн: изменения сохранены на устройстве и отправятся, когда появится интернет");
  setDot(pending?"wait":"live",pending?"Отправляю":"Синхронизировано");
}
function setDot(s,t){$("dot").dataset.s=s;$("dot").title=t}
addEventListener("online",syncState);addEventListener("offline",syncState);
function week(start){
  const k=iso(start);if(weeks.has(k))return weeks.get(k);
  const w={k,events:[],pending:false,ref:doc(fs,"users",uid,"weeks",k)};weeks.set(k,w);
  w.unsub=onSnapshot(w.ref,{includeMetadataChanges:true},s=>{
    const d=s.exists()?s.data():null;
    w.events=d&&Array.isArray(d.events)?d.events.map(e=>({...e})):[];
    w.pending=s.metadata.hasPendingWrites;w.loaded=true;
    schedule();syncState();
  },()=>setDot("off","Нет доступа к базе. Проверьте правила Firestore"));
  return w;
}
function save(w){
  w.pending=true;syncState();
  setDoc(w.ref,{events:w.events.map(e=>({...e})),updatedAt:new Date().toISOString()}).catch(()=>setDot("off","Не сохранилось"));
}
let raf=0;function schedule(){if(!raf)raf=requestAnimationFrame(()=>{raf=0;render()})}

/* ---------- layout ---------- */
function span(e){const s=toMin(e.start);let en=toMin(e.end);if(en==null)en=s+60;if(en<=s)en=s+30;return [s,Math.min(en,1440)]}
function lanes(list){
  const items=list.map(e=>{const[s,en]=span(e);return{e,s,en}}).sort((a,b)=>a.s-b.s||b.en-a.en);
  let cluster=[],ends=[],cEnd=-1;
  const flush=()=>{cluster.forEach(it=>it.n=ends.length);cluster=[];ends=[]};
  for(const it of items){
    if(it.s>=cEnd&&cluster.length)flush();
    let l=ends.findIndex(x=>x<=it.s);if(l<0){l=ends.length;ends.push(0)}
    ends[l]=it.en;it.l=l;cluster.push(it);cEnd=Math.max(cEnd,it.en);
  }
  flush();return items;
}
function timesEl(h){const t=document.createElement("div");t.className="times";t.style.height=(24*h)+"px";
  for(let k=1;k<24;k++){const s=document.createElement("span");s.style.top=(k*h)+"px";s.textContent=pad(k)+":00";t.append(s)}return t}
function colEl(w,start,i,h){
  const isToday=iso(addDays(start,i))===iso(new Date());
  const col=document.createElement("div");col.className="col"+(isToday?" today":"");
  col.onclick=ev=>{if(ev.target!==col)return;const m=Math.min(1410,Math.floor(ev.offsetY/(h/2))*30);openEditor(null,w,start,i,fmt(m),fmt(Math.min(1439,m+60)))};
  for(const it of lanes(w.events.filter(x=>x.day===i&&x.start))){
    const e=it.e,dur=it.en-it.s;
    const el=document.createElement("div");el.className="ev"+(e.done?" done":"")+(dur<45?" short":"");
    el.style.top=(it.s/60*h)+"px";el.style.height=Math.max(dur/60*h-2,18)+"px";
    el.style.left=`calc(${it.l*100/it.n}% + 2px)`;el.style.width=`calc(${100/it.n}% - 4px)`;
    const t=document.createElement("span");t.className="t";t.textContent=e.start+(e.end?"–"+e.end:"");
    const n=document.createElement("span");n.className="n";n.textContent=e.title;
    const ck=document.createElement("button");ck.className="ck";ck.setAttribute("aria-label",e.done?"Снять отметку":"Готово");
    ck.onclick=ev=>{ev.stopPropagation();e.done=!e.done;save(w);render()};
    el.append(t,n,ck);el.onclick=()=>openEditor(e,w,start);
    col.append(el);
  }
  if(isToday){const n=document.createElement("div");n.className="now";const now=new Date();n.style.top=((now.getHours()*60+now.getMinutes())/60*h)+"px";col.append(n)}
  return col;
}
function alldayEls(w,start,i){return w.events.filter(x=>x.day===i&&!x.start).map(e=>{
  const c=document.createElement("button");c.className="allday"+(e.done?" done":"");c.textContent=e.title;c.onclick=()=>openEditor(e,w,start);return c})}
function rangeText(a){const b=addDays(a,6);return a.getMonth()===b.getMonth()?`${a.getDate()}–${b.getDate()} ${MON[b.getMonth()]}`:`${a.getDate()} ${MON[a.getMonth()]} – ${b.getDate()} ${MON[b.getMonth()]}`}

function render(){
  if(!uid)return;
  const h=cssPx("--h"),frag=document.createDocumentFragment(),todayIso=iso(new Date());
  if(mq.matches){
    for(let wi=0;wi<rangeLen;wi++){
      const start=addDays(rangeStart,wi*7),w=week(start);
      for(let i=0;i<7;i++){
        const d=addDays(start,i);
        const sec=document.createElement("section");sec.className="day"+(iso(d)===todayIso?" today":"");
        sec.id=`d-${w.k}-${i}`;sec.dataset.k=w.k;sec.dataset.d=i;
        const lab=document.createElement("div");lab.className="lab";
        const b=document.createElement("b");b.textContent=`${DAYS[i]}, ${d.getDate()} ${MON[d.getMonth()]}`;
        lab.append(b,...alldayEls(w,start,i));
        sec.append(lab,timesEl(h),colEl(w,start,i,h));
        frag.append(sec);
      }
    }
  }else{
    const w=week(weekStart);
    const head=document.createElement("div");head.className="wk-head";head.append(document.createElement("div"));
    const body=document.createElement("div");body.className="wk-body";body.append(timesEl(h));
    for(let i=0;i<7;i++){
      const d=addDays(weekStart,i);
      const hc=document.createElement("div");hc.className="hc"+(iso(d)===todayIso?" today":"");
      const hd=document.createElement("div");hd.className="hd";hd.innerHTML=`<b>${d.getDate()}</b>${DAYS[i]}`;
      hc.append(hd,...alldayEls(w,weekStart,i));head.append(hc);
      body.append(colEl(w,weekStart,i,h));
    }
    frag.append(head,body);
  }
  $("view").replaceChildren(frag);
  document.documentElement.style.setProperty("--topH",$("top").offsetHeight+"px");
  updateTop();
}
function updateTop(){
  if(!mq.matches){$("range").textContent=rangeText(weekStart);return}
  const probe=$("top").getBoundingClientRect().bottom+1;
  for(const s of $("view").children){const r=s.getBoundingClientRect();if(r.top<=probe&&r.bottom>probe){visible={k:s.dataset.k,d:+s.dataset.d};break}}
  const ws=new Date(visible.k+"T00:00:00");
  $("range").textContent=rangeText(ws);
  const tabs=$("tabs"),todayIso=iso(new Date());
  if(tabs.dataset.k!==visible.k){
    tabs.dataset.k=visible.k;tabs.textContent="";
    for(let i=0;i<7;i++){const d=addDays(ws,i),t=document.createElement("button");
      t.className="tab"+(iso(d)===todayIso?" today":"");t.innerHTML=`<span>${DAYS[i]}</span><b>${d.getDate()}</b>`;
      t.onclick=()=>scrollToDay(visible.k,i,null);tabs.append(t)}
  }
  [...tabs.children].forEach((t,i)=>t.classList.toggle("sel",i===visible.d));
}
function topOffset(){return $("top").offsetHeight}
function scrollToDay(k,d,min){
  const el=$(`d-${k}-${d}`);if(!el)return;
  const y=el.getBoundingClientRect().top+scrollY-topOffset()+(min==null?0:cssPx("--lab")+min/60*cssPx("--h"));
  scrollTo(0,Math.max(0,y));updateTop();
}
function scrollToNow(){
  const now=new Date(),m=now.getHours()*60+now.getMinutes();
  if(mq.matches){scrollToDay(iso(monday(now)),(now.getDay()+6)%7,Math.max(0,m-90))}
  else{const target=iso(weekStart)===iso(monday(now))?Math.max(0,m-120):7*60;
    const body=document.querySelector(".wk-body");if(!body)return;
    const head=document.querySelector(".wk-head").offsetHeight;
    scrollTo(0,body.getBoundingClientRect().top+scrollY-topOffset()-head+target/60*cssPx("--h"))}
}
function grow(){
  if(!uid||!mq.matches||rangeLen>=40)return;
  const H=innerHeight,de=document.documentElement;
  if(scrollY+H>de.scrollHeight-2*H){rangeLen++;render()}
  else if(scrollY<2*H){const before=de.scrollHeight;rangeStart=addDays(rangeStart,-7);rangeLen++;render();scrollBy(0,de.scrollHeight-before)}
}
let sraf=0;addEventListener("scroll",()=>{if(!sraf)sraf=requestAnimationFrame(()=>{sraf=0;if(uid){updateTop();grow()}})},{passive:true});

/* ---------- editor ---------- */
const WD=["Вс","Пн","Вт","Ср","Чт","Пт","Сб"];
const dateLabel=d=>`${WD[d.getDay()]}, ${d.getDate()} ${MON[d.getMonth()]}${d.getFullYear()!==new Date().getFullYear()?" "+d.getFullYear():""}`;
const dateText=d=>`${pad(d.getDate())}.${pad(d.getMonth()+1)}.${d.getFullYear()}`;
const dayOnly=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());
function parseDate(s,fallback){
  const m=s.trim().match(/^(\d{1,2})[.\/\-\s](\d{1,2})(?:[.\/\-\s](\d{2,4}))?$/);if(!m)return null;
  let y=m[3]?+m[3]:fallback.getFullYear();if(y<100)y+=2000;
  const d=new Date(y,+m[2]-1,+m[1]);return d.getMonth()===+m[2]-1?d:null;
}
function parseTime(s){
  const t=s.trim().replace(/\s/g,"");let m=t.match(/^(\d{1,2})[:.,-](\d{1,2})$/)||t.match(/^(\d{1,2})(\d{2})$/)||t.match(/^(\d{1,2})$/);
  if(!m)return null;const h=+m[1],mi=m[2]==null?0:+m[2];return h<24&&mi<60?fmt(h*60+mi):null;
}
function defaultDate(){
  const today=dayOnly(new Date());
  if(mq.matches)return addDays(new Date(visible.k+"T00:00:00"),visible.d);
  return iso(monday(today))===iso(weekStart)?today:new Date(weekStart);
}
function nextSlot(){const n=new Date(),m=Math.min(1380,Math.ceil((n.getHours()*60+n.getMinutes()+1)/30)*30);return fmt(m)}

/* one scroll-snap wheel; onPick(index) fires when it settles */
function makeWheel(items,idx,onPick,wide){
  const el=document.createElement("div");el.className="wheel"+(wide?" wide":"");
  items.forEach((t,i)=>{const it=document.createElement("div");it.textContent=t;it.onclick=()=>{el.scrollTop=i*36};el.append(it)});
  let tm=0;el.skip=false;
  el.addEventListener("scroll",()=>{clearTimeout(tm);tm=setTimeout(()=>{
    if(el.skip){el.skip=false;return}
    onPick(Math.max(0,Math.min(items.length-1,Math.round(el.scrollTop/36))))},90)},{passive:true});
  el.set=i=>{const t=i*36;if(Math.abs(el.scrollTop-t)>1){el.skip=true;el.scrollTop=t}};
  requestAnimationFrame(()=>el.set(idx));
  return el;
}

function openEditor(e,w,wStart,day,s0,e0){
  const isNew=!e;
  const st={
    title:e?e.title:"",
    date:dayOnly(wStart?addDays(wStart,e?e.day:day):defaultDate()),
    allDay:e?!e.start:false,
    start:(e&&e.start)||s0||nextSlot(),
    end:(e&&e.end)||e0||""
  };
  if(!st.end){const s=toMin(st.start);st.end=fmt(Math.min(1439,s+60))}
  let active="start";
  const m=$("modal");
  m.innerHTML=`<div class="back" id="bk"><form class="sheet" id="f" autocomplete="off">
    <input id="f-title" maxlength="120" placeholder="Что делаем" aria-label="Название">
    <label class="fld"><span>Дата</span><input id="f-date" readonly inputmode="numeric" aria-label="Дата"></label>
    <label class="sw">Без времени<input type="checkbox" id="f-all"></label>
    <div class="row" id="f-times">
      <label class="fld"><span>Начало</span><input id="f-start" readonly inputmode="numeric" aria-label="Начало"></label>
      <label class="fld"><span>Конец</span><input id="f-end" readonly inputmode="numeric" aria-label="Конец"></label>
    </div>
    <div class="picker" id="f-pick"></div>
    <div class="hint">Нажмите на поле ещё раз, чтобы ввести вручную.</div>
    <div class="acts">
      <button type="button" class="link" id="f-cancel">Отмена</button>
      ${isNew?"":`<button type="button" class="link" id="f-del">Удалить</button>`}
      <button type="submit" class="save">${isNew?"Добавить":"Сохранить"}</button>
    </div>
  </form></div>`;
  const F={date:$("f-date"),start:$("f-start"),end:$("f-end")};
  $("f-title").value=st.title;$("f-all").checked=st.allDay;

  function show(){
    F.date.value=F.date.readOnly?dateLabel(st.date):F.date.value;
    if(F.start.readOnly)F.start.value=st.start;
    if(F.end.readOnly)F.end.value=st.end;
    $("f-times").hidden=st.allDay;
    if(st.allDay&&active!=="date")active="date";
    Object.entries(F).forEach(([k,el])=>el.classList.toggle("act",k===active));
  }
  function setStart(v){const d=toMin(st.end)-toMin(st.start);st.start=v;st.end=fmt(Math.min(1439,toMin(v)+(d>0?d:60)))}
  function buildPicker(){
    const p=$("f-pick");p.textContent="";
    if(active==="date"){
      const today=dayOnly(new Date()),base=addDays(today,-60);
      const n=Math.max(426,Math.round((st.date-base)/864e5)+30);
      const days=[];for(let i=0;i<n;i++)days.push(addDays(base,i));
      let idx=Math.round((dayOnly(st.date)-base)/864e5);
      if(idx<0){days.unshift(...Array.from({length:-idx},(_,i)=>addDays(st.date,i)));idx=0}
      p.append(makeWheel(days.map(dateLabel),idx,i=>{st.date=days[i];show()},true));
    }else{
      const key=active,cur=toMin(st[key]);
      const mins=Array.from({length:12},(_,i)=>i*5);
      let hh=Math.floor(cur/60),mm=cur%60;
      const hW=makeWheel(Array.from({length:24},(_,i)=>pad(i)),hh,i=>{hh=i;apply()});hW.classList.add("h");
      const mW=makeWheel(mins.map(pad),Math.round(mm/5)%12,i=>{mm=mins[i];apply()});mW.classList.add("m");
      function apply(){const v=fmt(hh*60+mm);if(key==="start")setStart(v);else st.end=v;show()}
      const c=document.createElement("span");c.className="colon";c.textContent=":";
      p.append(hW,c,mW);
    }
  }
  /* first tap on a field = its wheel, second tap = keyboard */
  Object.entries(F).forEach(([k,el])=>{
    el.addEventListener("click",ev=>{
      if(active!==k){ev.preventDefault();active=k;show();buildPicker();return}
      if(el.readOnly){el.readOnly=false;el.value=k==="date"?dateText(st.date):st[k];el.focus();el.select()}
    });
    el.addEventListener("blur",()=>commit(k));
    el.addEventListener("keydown",ev=>{if(ev.key==="Enter"){ev.preventDefault();el.blur()}});
  });
  function commit(k){
    const el=F[k];if(el.readOnly)return;
    if(k==="date"){const d=parseDate(el.value,st.date);if(d)st.date=d}
    else{const v=parseTime(el.value);if(v){if(k==="start")setStart(v);else st.end=v}}
    el.readOnly=true;show();buildPicker();
  }
  $("f-all").onchange=ev=>{st.allDay=ev.target.checked;active=st.allDay?"date":"start";show();buildPicker()};

  const close=()=>{m.innerHTML=""};
  $("f-cancel").onclick=close;
  $("bk").onclick=ev=>{if(ev.target.id==="bk")close()};
  if(!isNew){let armed=false;$("f-del").onclick=()=>{
    if(!armed){armed=true;$("f-del").textContent="Точно?";return}
    w.events=w.events.filter(x=>x.id!==e.id);save(w);render();close()}}
  $("f").onsubmit=ev=>{ev.preventDefault();
    Object.keys(F).forEach(commit);
    const title=$("f-title").value.trim();if(!title){$("f-title").focus();return}
    const tw=week(monday(st.date));
    const item={id:e?e.id:Math.random().toString(36).slice(2,10),title,day:(st.date.getDay()+6)%7,
      start:st.allDay?"":st.start,end:st.allDay?"":st.end,done:e?!!e.done:false};
    if(e&&w.k!==tw.k){w.events=w.events.filter(x=>x.id!==e.id);save(w)}
    if(e&&w.k===tw.k){w.events=w.events.map(x=>x.id===e.id?item:x);save(w)}
    else if(tw.loaded){tw.events.push(item);save(tw)}
    else{setDoc(tw.ref,{events:arrayUnion(item),updatedAt:new Date().toISOString()},{merge:true}).catch(()=>setDot("off","Не сохранилось"))}
    render();close();
    if(mq.matches)requestAnimationFrame(()=>scrollToDay(tw.k,item.day,item.start?Math.max(0,toMin(item.start)-60):null));
  };
  show();buildPicker();
  if(isNew)setTimeout(()=>$("f-title").focus(),30);
}
document.addEventListener("keydown",k=>{if(k.key==="Escape")$("modal").innerHTML=""});
$("fab").onclick=()=>openEditor(null);

/* ---------- navigation ---------- */
function go(delta){
  if(mq.matches){
    if(delta===0)return scrollToNow();
    const target=addDays(new Date(visible.k+"T00:00:00"),7*delta),de=document.documentElement;
    while(target<rangeStart){const before=de.scrollHeight;rangeStart=addDays(rangeStart,-7);rangeLen++;render();scrollBy(0,de.scrollHeight-before)}
    while(addDays(rangeStart,rangeLen*7)<=target){rangeLen++;render()}
    scrollToDay(iso(target),0,null);
  }else{
    weekStart=delta===0?monday(new Date()):addDays(weekStart,7*delta);
    render();scrollToNow();
  }
}
$("prev").onclick=()=>go(-1);$("next").onclick=()=>go(1);$("now").onclick=()=>go(0);
mq.addEventListener("change",()=>{render();scrollToNow()});
setInterval(()=>uid&&render(),60000);

/* ---------- auth ---------- */
$("lf").onsubmit=async ev=>{ev.preventDefault();$("l-err").textContent="";
  try{await signInWithEmailAndPassword(auth,$("l-email").value.trim(),$("l-pass").value)}
  catch(e){$("l-err").textContent=navigator.onLine?"Неверная почта или пароль":"Для первого входа нужен интернет"}};
$("logout").onclick=()=>signOut(auth);
onAuthStateChanged(auth,user=>{
  $("boot").hidden=true;
  weeks.forEach(w=>w.unsub?.());weeks.clear();
  uid=user?user.uid:null;
  $("login").hidden=!!user;$("app").hidden=!user;$("fab").hidden=!user;
  if(user){render();syncState();requestAnimationFrame(()=>requestAnimationFrame(scrollToNow))}
});

/* ---------- offline copy + auto-update ---------- */
const BUILD="20261005200208";
async function checkVersion(){
  if(!navigator.onLine)return;
  try{const r=await fetch("version.txt?t="+Date.now(),{cache:"no-store"});if(!r.ok)return;
    const v=(await r.text()).trim();if(v&&v!==BUILD&&!$("modal").children.length)location.reload()}catch(e){}
}
document.addEventListener("visibilitychange",()=>{if(!document.hidden)checkVersion()});
addEventListener("online",checkVersion);
setTimeout(checkVersion,3000);
if("serviceWorker" in navigator){
  let reloaded=false;const had=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener("controllerchange",()=>{if(had&&!reloaded){reloaded=true;location.reload()}});
  navigator.serviceWorker.register("sw.js").then(r=>{r.update();document.addEventListener("visibilitychange",()=>{if(!document.hidden)r.update()})});
}
