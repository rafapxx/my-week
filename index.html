<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Неделя">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Моя неделя</title>
<style>
:root{
  --bg:#000; --line:#1f1f1f; --line-h:#2c2c2c; --fg:#f2f2f2; --muted:#7c7c7c; --dim:#4a4a4a; --field:#0e0e0e;
  --ev:#1b1b1b; --ev-b:#3a3a3a; --now:#e5484d;
  --f:"Nunito",ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,sans-serif;
  --h:48px; --tc:44px; --lab:34px; --topH:60px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);overflow-anchor:none}
body{color:var(--fg);font-family:var(--f);font-size:14px;line-height:1.35;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:1px solid var(--fg);outline-offset:2px}
[hidden]{display:none!important}
.app{max-width:1400px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left));padding-bottom:calc(40px + env(safe-area-inset-bottom))}

.top{position:sticky;top:0;z-index:6;background:var(--bg);padding-top:calc(12px + env(safe-area-inset-top));border-bottom:1px solid var(--line-h)}
.bar{display:flex;align-items:center;gap:12px;padding-bottom:10px}
.range{font-size:1rem;font-weight:500;font-variant-numeric:tabular-nums}
.dot{width:6px;height:6px;border-radius:50%;background:var(--dim);flex:none}
.dot[data-s="live"]{background:var(--fg)}
.dot[data-s="off"]{background:var(--now)}
.nav{margin-left:auto;display:flex;gap:2px}
.nav button{min-width:36px;height:36px;padding:0 10px;color:var(--muted);border-radius:8px}
.nav button:hover{color:var(--fg);background:var(--field)}
.tabs{display:none;grid-template-columns:repeat(7,1fr);gap:2px;padding-bottom:8px}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:8px;color:var(--muted);font-size:.72rem}
.tab b{font-weight:500;font-size:1rem;color:var(--fg);font-variant-numeric:tabular-nums}
.tab.sel{background:var(--fg);color:var(--bg)}
.tab.sel b{color:var(--bg)}
.tab.today:not(.sel) b{color:var(--now)}

.times{position:relative}
.times span{position:absolute;right:8px;transform:translateY(-50%);font-size:.68rem;color:var(--muted);font-variant-numeric:tabular-nums}
.col{position:relative;height:calc(var(--h) * 24);border-left:1px solid var(--line);
  background-image:linear-gradient(var(--line-h) 1px,transparent 1px),linear-gradient(var(--line) 1px,transparent 1px);
  background-size:100% var(--h),100% calc(var(--h) / 2)}
.col.today{background-color:#070707}
.now{position:absolute;left:-1px;right:0;height:2px;background:var(--now);z-index:2;pointer-events:none}
.now::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--now)}
.ev{position:absolute;z-index:1;padding:3px 6px;border-radius:6px;background:var(--ev);border:1px solid var(--ev-b);overflow:hidden;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:1px;min-width:0}
.ev:hover{border-color:var(--muted)}
.ev .t{font-size:.68rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.ev .n{font-size:.8rem;overflow-wrap:anywhere}
.ev.short{flex-direction:row;align-items:baseline;gap:6px}
.ev.short .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.done{opacity:.45}
.ev.done .n{text-decoration:line-through}
.ev .ck{position:absolute;top:4px;right:4px;width:12px;height:12px;border-radius:50%;box-shadow:inset 0 0 0 1px var(--muted)}
.ev.done .ck{background:var(--fg);box-shadow:none}
.ev .n,.ev .t{padding-right:14px}
.allday{flex:none;font-size:.75rem;background:var(--ev);border-left:2px solid var(--muted);border-radius:4px;padding:2px 6px;text-align:left;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.allday.done{opacity:.45;text-decoration:line-through}

.wk-head,.wk-body{display:grid;grid-template-columns:var(--tc) repeat(7,minmax(0,1fr))}
.wk-head{position:sticky;top:var(--topH);z-index:4;background:var(--bg);border-bottom:1px solid var(--line-h)}
.hc{padding:8px 6px 6px;border-left:1px solid var(--line);min-width:0;display:flex;flex-direction:column;gap:4px}
.hd{display:flex;align-items:baseline;gap:6px;color:var(--muted);font-size:.75rem}
.hd b{font-weight:500;font-size:1.05rem;color:var(--fg);font-variant-numeric:tabular-nums}
.hc.today .hd b{color:var(--now)}

.day{display:grid;grid-template-columns:var(--tc) minmax(0,1fr)}
.lab{grid-column:1/-1;height:var(--lab);display:flex;align-items:center;gap:8px;border-top:1px solid var(--line-h);overflow-x:auto;scrollbar-width:none;color:var(--muted);font-size:.75rem;white-space:nowrap}
.lab::-webkit-scrollbar{display:none}
.lab b{color:var(--fg);font-weight:500;font-size:.9rem}
.day.today .lab b{color:var(--now)}
.foot{padding:24px 0;text-align:center}
.foot button{color:var(--dim);font-size:.75rem}

.back{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{width:100%;max-width:440px;background:#111;border-radius:14px 14px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
@media (min-width:701px){.back{align-items:center}.sheet{border-radius:14px}}
input,select{font:inherit;font-size:16px;color:var(--fg);background:var(--field);border:1px solid var(--line-h);border-radius:8px;padding:10px 12px;width:100%;min-width:0}
input:focus,select:focus{outline:none;border-color:var(--muted)}
input::-webkit-calendar-picker-indicator{filter:invert(1);opacity:.5}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hint{font-size:.72rem;color:var(--muted);margin-top:-4px}

/* "+" button */
.fab{position:fixed;right:max(20px,env(safe-area-inset-right));bottom:calc(20px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;background:var(--fg);color:var(--bg);padding:0;z-index:8;box-shadow:0 6px 20px rgba(0,0,0,.6);display:grid;place-items:center}
.fab svg{display:block}
.fab:active{transform:scale(.95)}

/* editor fields: tap = wheel, tap again = keyboard */
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld span{font-size:.7rem;color:var(--muted)}
.fld input{font-variant-numeric:tabular-nums;cursor:pointer}
.fld input.act{border-color:var(--fg)}
.fld input:not([readonly]){cursor:text;background:#000}
.sw{display:flex;align-items:center;justify-content:space-between;font-size:.9rem;padding:2px 0}
.sw input{appearance:none;-webkit-appearance:none;width:44px;height:26px;border-radius:13px;background:var(--line-h);position:relative;padding:0;border:0;cursor:pointer;flex:none;transition:background .15s}
.sw input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--fg);transition:transform .15s}
.sw input:checked{background:var(--fg)}
.sw input:checked::after{background:var(--bg);transform:translateX(18px)}

/* wheel picker */
.picker{position:relative;display:flex;justify-content:center;align-items:center;gap:2px;height:180px;user-select:none;-webkit-user-select:none}
.picker::before{content:"";position:absolute;left:0;right:0;top:72px;height:36px;background:var(--field);border:1px solid var(--line-h);border-radius:8px;pointer-events:none}
.wheel{position:relative;height:180px;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;flex:1 1 0;min-width:0;padding-block:72px;overscroll-behavior:contain;
  -webkit-mask-image:linear-gradient(transparent,#000 35%,#000 65%,transparent);mask-image:linear-gradient(transparent,#000 35%,#000 65%,transparent)}
.wheel::-webkit-scrollbar{display:none}
.wheel.h div{text-align:right;padding-right:14px}
.wheel.m div{text-align:left;padding-left:14px}
.wheel div{height:36px;line-height:36px;text-align:center;scroll-snap-align:center;font-size:1.1rem;font-variant-numeric:tabular-nums;cursor:pointer}
.picker .colon{position:relative;flex:none;font-size:1.1rem;color:var(--muted)}
.acts{display:flex;align-items:center;gap:16px}
.acts .link{color:var(--muted);font-size:.85rem}
.acts .link:hover{color:var(--fg)}
.save{margin-left:auto;background:var(--fg);color:var(--bg);border-radius:8px;padding:10px 18px;font-weight:500}

.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.login form{width:100%;max-width:340px;display:flex;flex-direction:column;gap:12px}
.login h1{font-weight:500;font-size:1.4rem;margin:0 0 8px}
.login .err{color:var(--now);font-size:.8rem;min-height:1em}
.login .save{margin-left:0}
.boot{min-height:100vh;display:grid;place-items:center;color:var(--dim)}


/* ---- white neon layer ---- */
:root{--neon:#fff;--glow:0 0 6px rgba(255,255,255,.8),0 0 18px rgba(255,255,255,.35)}
.tab.sel{background:var(--neon);box-shadow:var(--glow)}
.tab.today:not(.sel) b,.hc.today .hd b,.day.today .lab b{color:var(--neon);text-shadow:var(--glow);text-decoration:none}
.dot[data-s="live"]{background:var(--neon);box-shadow:var(--glow)}
.now{background:var(--neon);box-shadow:0 0 6px #fff,0 0 16px rgba(255,255,255,.6)}
.now::before{background:var(--now);box-shadow:0 0 8px var(--now),0 0 16px var(--now)}
.ev{border-color:rgba(255,255,255,.3);box-shadow:inset 0 0 10px rgba(255,255,255,.05)}
.ev:hover{border-color:var(--neon);box-shadow:var(--glow)}
.ev.done .ck{box-shadow:0 0 6px #fff}
.fab{background:var(--neon);box-shadow:0 0 12px rgba(255,255,255,.7),0 0 36px rgba(255,255,255,.3)}
.save{box-shadow:0 0 12px rgba(255,255,255,.4)}
.picker::before{border-color:rgba(255,255,255,.45);box-shadow:0 0 12px rgba(255,255,255,.18)}
.fld input.act{border-color:var(--neon);box-shadow:0 0 10px rgba(255,255,255,.3)}
.sw input:checked{background:var(--neon);box-shadow:var(--glow)}

/* colors, templates, duration */
.ev{--c:#f2f2f2;background:var(--c);border-color:transparent;box-shadow:none;color:#0b0b0b}
.ev .t{color:rgba(0,0,0,.6)}
.ev:hover{border-color:transparent;box-shadow:none;filter:brightness(1.08)}
.ev .ck{box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.55)}
.ev.done .ck{background:#0b0b0b;box-shadow:none}
.allday{--c:#f2f2f2;border-left:0;background:var(--c);color:#0b0b0b}
#f-title{border-left:3px solid var(--c,#f2f2f2)}
.colors{display:flex;gap:10px;flex-wrap:wrap}
.cl{width:26px;height:26px;border-radius:50%;background:var(--c)}
.cl.on{outline:2px solid var(--c);outline-offset:3px}
.tpls{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-bottom:2px}
.tpls::-webkit-scrollbar{display:none}
.tp{flex:none;display:inline-flex;align-items:center;gap:8px;padding:7px 10px 7px 12px;border-radius:999px;border:0;background:var(--c);color:#0b0b0b;font-size:.85rem;white-space:nowrap}
.tp .x{color:rgba(0,0,0,.55);font-size:.9rem;padding:0 2px}
.tp .x.armed{color:#0b0b0b;font-weight:600;font-size:.75rem}
.ends{font-size:.75rem;color:var(--muted);margin-top:6px}
.presets{display:flex;gap:6px;flex-wrap:wrap}
.ps{padding:6px 10px;border-radius:8px;border:1px solid var(--line-h);font-size:.8rem;color:var(--muted)}
.ps.on{color:var(--bg);background:var(--neon);border-color:var(--neon);box-shadow:var(--glow)}
.wheel:not(.h):not(.m){flex:1 1 0}

/* soft rounded type */
body{font-weight:600}
.range,.tab b,.hd b,.lab b,.login h1,.save,.ev .n{font-weight:800}
.range{font-size:1.08rem}
.tab b{font-size:1.1rem}
input,select,button{font-weight:inherit}

/* hold-to-add */
.col{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.ghost{position:absolute;left:2px;right:2px;z-index:1;border:1px dashed var(--neon,#fff);border-radius:6px;background:rgba(255,255,255,.08);
  font-size:.7rem;color:var(--fg);padding:2px 6px;pointer-events:none;box-shadow:var(--glow)}

/* quick add line */
.quick{display:flex;gap:8px;padding-bottom:8px}
.quick input{flex:1;min-width:0;padding:9px 12px;border-radius:10px}
.quick input:focus{border-color:var(--neon,#fff);box-shadow:0 0 10px rgba(255,255,255,.25)}
.quick button{flex:none;background:var(--fg);color:var(--bg);border-radius:10px;padding:0 14px;font-weight:800}
.qprev{display:flex;align-items:center;gap:8px;width:100%;text-align:left;font-size:.8rem;color:var(--fg);padding:0 2px 8px}
.qprev i{width:10px;height:10px;border-radius:50%;flex:none}
.qprev span{margin-left:auto;color:var(--muted);text-decoration:underline;text-underline-offset:3px}

.quick .mic{background:var(--field);color:var(--fg);border:1px solid var(--line-h);padding:0 11px}
.quick .mic.on{background:var(--now);border-color:var(--now);color:#fff;box-shadow:0 0 12px var(--now);animation:micp 1.2s ease-in-out infinite}
@keyframes micp{50%{box-shadow:0 0 2px var(--now)}}
@media (prefers-reduced-motion:reduce){.quick .mic.on{animation:none}}
body.daymode .tabs{display:grid}
.seg{display:flex;background:var(--field);border:1px solid var(--line-h);border-radius:9px;padding:2px;margin-left:auto}
.seg button{padding:5px 9px;border-radius:7px;font-size:.78rem;color:var(--muted)}
.seg button.on{background:var(--neon,#fff);color:var(--bg);box-shadow:var(--glow)}
.seg+.nav{margin-left:0}
@media (max-width:700px){
  .range{font-size:.95rem}
  .bar{gap:8px}
  .nav button{min-width:30px;padding:0 6px}
  .seg button{padding:5px 7px;font-size:.75rem}
  :root{--h:56px;--tc:40px}
}
</style>
</head>
<body>
<div class="boot" id="boot">Загружаю…</div>

<div class="login" id="login" hidden>
  <form id="lf">
    <h1>Моя неделя</h1>
    <input id="l-email" type="email" autocomplete="username" placeholder="Почта" required>
    <input id="l-pass" type="password" autocomplete="current-password" placeholder="Пароль" required>
    <div class="err" id="l-err"></div>
    <button type="submit" class="save">Войти</button>
  </form>
</div>

<div class="app" id="app" hidden>
  <div class="top" id="top">
    <div class="bar">
      <span class="dot" id="dot" title="Подключаюсь"></span>
      <span class="range" id="range"></span>
      <div class="seg" id="seg"><button data-m="day">День</button><button data-m="week">Неделя</button></div>
      <div class="nav">
        <button id="prev" aria-label="Назад">←</button>
        <button id="now">Сегодня</button>
        <button id="next" aria-label="Вперёд">→</button>
      </div>
    </div>
    <form class="quick" id="qf" autocomplete="off">
      <input id="q" placeholder="Добавление текстом" enterkeyhint="done" aria-label="Быстро добавить дело">
      <button type="button" class="mic" id="q-mic" aria-label="Голосовой ввод"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3" fill="currentColor"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg></button>
      <button type="submit" id="q-go" hidden>Добавить</button>
    </form>
    <button type="button" class="qprev" id="q-prev" hidden></button>
    <div class="tabs" id="tabs"></div>
  </div>
  <div id="view"></div>
  <div class="foot" style="padding-bottom:64px"><button id="logout">Выйти</button></div>
</div>
<button class="fab" id="fab" aria-label="Добавить дело" hidden><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M12 4v16M4 12h16" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg></button>
<div id="modal"></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
import {initializeFirestore,persistentLocalCache,persistentMultipleTabManager,doc,onSnapshot,setDoc,arrayUnion} from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

const firebaseConfig={
  apiKey:"AIzaSyCS-a6ROL_7dvV9VxabCHjqT1R4e8bkT9w",
  authDomain:"timetablerafael.firebaseapp.com",
  projectId:"timetablerafael",
  storageBucket:"timetablerafael.firebasestorage.app",
  messagingSenderId:"830920379530",
  appId:"1:830920379530:web:941eb5b8a83fee6370f173"
};
const fbApp=initializeApp(firebaseConfig);
const auth=getAuth(fbApp);
const fs=initializeFirestore(fbApp,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})});

const DAYS=["Пн","Вт","Ср","Чт","Пт","Сб","Вс"];
const MON=["янв","фев","мар","апр","мая","июн","июл","авг","сен","окт","ноя","дек"];
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const toMin=t=>{if(!t)return null;const[a,b]=t.split(":");return +a*60+ +b};
const fmt=m=>pad(Math.floor(m/60))+":"+pad(m%60);
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
function monday(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-(x.getDay()+6)%7);return x}
const mq=matchMedia("(max-width:700px)");
let mode=(()=>{try{return localStorage.getItem("viewMode")}catch(e){return null}})()||(mq.matches?"day":"week");
const isDay=()=>mode==="day";
const cssPx=v=>parseFloat(getComputedStyle(document.documentElement).getPropertyValue(v))||0;

let uid=null;
const weeks=new Map();
let weekStart=monday(new Date());
let rangeStart=addDays(weekStart,-7),rangeLen=3;
let visible={k:iso(weekStart),d:(new Date().getDay()+6)%7};

/* ---------- storage: users/{uid}/weeks/{monday} ---------- */
function syncState(){
  const pending=[...weeks.values()].some(w=>w.pending);
  if(!navigator.onLine)return setDot("off","Офлайн: изменения сохранены на устройстве и отправятся, когда появится интернет");
  setDot(pending?"wait":"live",pending?"Отправляю":"Синхронизировано");
}
function setDot(s,t){$("dot").dataset.s=s;$("dot").title=t}
addEventListener("online",syncState);addEventListener("offline",syncState);
function week(start){
  const k=iso(start);if(weeks.has(k))return weeks.get(k);
  const w={k,events:[],pending:false,ref:doc(fs,"users",uid,"weeks",k)};weeks.set(k,w);
  w.unsub=onSnapshot(w.ref,{includeMetadataChanges:true},s=>{
    const d=s.exists()?s.data():null;
    w.events=d&&Array.isArray(d.events)?d.events.map(e=>({...e})):[];
    w.pending=s.metadata.hasPendingWrites;w.loaded=true;
    schedule();syncState();
  },()=>setDot("off","Нет доступа к базе. Проверьте правила Firestore"));
  return w;
}
function save(w){
  w.pending=true;syncState();
  setDoc(w.ref,{events:w.events.map(e=>({...e})),updatedAt:new Date().toISOString()}).catch(()=>setDot("off","Не сохранилось"));
}
let raf=0;function schedule(){if(!raf)raf=requestAnimationFrame(()=>{raf=0;render()})}

/* ---------- layout ---------- */
function span(e){const s=toMin(e.start);let en=toMin(e.end);if(en==null)en=s+60;if(en<=s)en=s+30;return [s,Math.min(en,1440)]}
function lanes(list){
  const items=list.map(e=>{const[s,en]=span(e);return{e,s,en}}).sort((a,b)=>a.s-b.s||b.en-a.en);
  let cluster=[],ends=[],cEnd=-1;
  const flush=()=>{cluster.forEach(it=>it.n=ends.length);cluster=[];ends=[]};
  for(const it of items){
    if(it.s>=cEnd&&cluster.length)flush();
    let l=ends.findIndex(x=>x<=it.s);if(l<0){l=ends.length;ends.push(0)}
    ends[l]=it.en;it.l=l;cluster.push(it);cEnd=Math.max(cEnd,it.en);
  }
  flush();return items;
}
function timesEl(h){const t=document.createElement("div");t.className="times";t.style.height=(24*h)+"px";
  for(let k=1;k<24;k++){const s=document.createElement("span");s.style.top=(k*h)+"px";s.textContent=pad(k)+":00";t.append(s)}return t}
function colEl(w,start,i,h){
  const isToday=iso(addDays(start,i))===iso(new Date());
  const col=document.createElement("div");col.className="col"+(isToday?" today":"");
  /* hold on an empty spot ≈0.5 s → new event at that time, snapped to 30 min */
  let hold=null;
  const cancel=()=>{if(hold){clearTimeout(hold.t1);clearTimeout(hold.t2);hold.g?.remove();hold=null}};
  col.addEventListener("pointerdown",ev=>{
    if(ev.target!==col||ev.button>0)return;
    const y=ev.clientY-col.getBoundingClientRect().top,m=Math.min(1410,Math.max(0,Math.floor(y/(h/2))*30));
    hold={x:ev.clientX,y:ev.clientY};
    hold.t1=setTimeout(()=>{if(!hold)return;const g=document.createElement("div");g.className="ghost";
      g.style.top=(m/60*h)+"px";g.style.height=(h/2)+"px";g.textContent=fmt(m);col.append(g);hold.g=g},180);
    hold.t2=setTimeout(()=>{cancel();navigator.vibrate?.(10);openEditor(null,w,start,i,fmt(m),fmt(Math.min(1439,m+60)))},550);
  });
  col.addEventListener("pointermove",ev=>{if(hold&&Math.hypot(ev.clientX-hold.x,ev.clientY-hold.y)>8)cancel()});
  ["pointerup","pointercancel","pointerleave"].forEach(t=>col.addEventListener(t,cancel));
  col.addEventListener("scroll",cancel);addEventListener("scroll",cancel,{passive:true,once:true});
  col.addEventListener("contextmenu",ev=>ev.preventDefault());
  for(const it of lanes(w.events.filter(x=>x.day===i&&x.start))){
    const e=it.e,dur=it.en-it.s;
    const el=document.createElement("div");el.className="ev"+(e.done?" done":"")+(dur<45?" short":"");el.style.setProperty("--c",colorOf(e.color));
    el.style.top=(it.s/60*h)+"px";el.style.height=Math.max(dur/60*h-2,18)+"px";
    el.style.left=`calc(${it.l*100/it.n}% + 2px)`;el.style.width=`calc(${100/it.n}% - 4px)`;
    const t=document.createElement("span");t.className="t";t.textContent=e.start+(e.end?"–"+e.end:"");
    const n=document.createElement("span");n.className="n";n.textContent=e.title;
    const ck=document.createElement("button");ck.className="ck";ck.setAttribute("aria-label",e.done?"Снять отметку":"Готово");
    ck.onclick=ev=>{ev.stopPropagation();e.done=!e.done;save(w);render()};
    el.append(t,n,ck);el.onclick=()=>openEditor(e,w,start);
    col.append(el);
  }
  if(isToday){const n=document.createElement("div");n.className="now";const now=new Date();n.style.top=((now.getHours()*60+now.getMinutes())/60*h)+"px";col.append(n)}
  return col;
}
function alldayEls(w,start,i){return w.events.filter(x=>x.day===i&&!x.start).map(e=>{
  const c=document.createElement("button");c.className="allday"+(e.done?" done":"");c.style.setProperty("--c",colorOf(e.color));c.textContent=e.title;c.onclick=()=>openEditor(e,w,start);return c})}
function rangeText(a){const b=addDays(a,6);return a.getMonth()===b.getMonth()?`${a.getDate()}–${b.getDate()} ${MON[b.getMonth()]}`:`${a.getDate()} ${MON[a.getMonth()]} – ${b.getDate()} ${MON[b.getMonth()]}`}

function render(){
  if(!uid)return;
  const h=cssPx("--h"),frag=document.createDocumentFragment(),todayIso=iso(new Date());
  if(isDay()){
    for(let wi=0;wi<rangeLen;wi++){
      const start=addDays(rangeStart,wi*7),w=week(start);
      for(let i=0;i<7;i++){
        const d=addDays(start,i);
        const sec=document.createElement("section");sec.className="day"+(iso(d)===todayIso?" today":"");
        sec.id=`d-${w.k}-${i}`;sec.dataset.k=w.k;sec.dataset.d=i;
        const lab=document.createElement("div");lab.className="lab";
        const b=document.createElement("b");b.textContent=`${DAYS[i]}, ${d.getDate()} ${MON[d.getMonth()]}`;
        lab.append(b,...alldayEls(w,start,i));
        sec.append(lab,timesEl(h),colEl(w,start,i,h));
        frag.append(sec);
      }
    }
  }else{
    const w=week(weekStart);
    const head=document.createElement("div");head.className="wk-head";head.append(document.createElement("div"));
    const body=document.createElement("div");body.className="wk-body";body.append(timesEl(h));
    for(let i=0;i<7;i++){
      const d=addDays(weekStart,i);
      const hc=document.createElement("div");hc.className="hc"+(iso(d)===todayIso?" today":"");
      const hd=document.createElement("div");hd.className="hd";hd.innerHTML=`<b>${d.getDate()}</b>${DAYS[i]}`;
      hc.append(hd,...alldayEls(w,weekStart,i));head.append(hc);
      body.append(colEl(w,weekStart,i,h));
    }
    frag.append(head,body);
  }
  $("view").replaceChildren(frag);
  document.documentElement.style.setProperty("--topH",$("top").offsetHeight+"px");
  updateTop();
}
function updateTop(){
  if(!isDay()){$("range").textContent=rangeText(weekStart);return}
  const probe=$("top").getBoundingClientRect().bottom+1;
  for(const s of $("view").children){const r=s.getBoundingClientRect();if(r.top<=probe&&r.bottom>probe){visible={k:s.dataset.k,d:+s.dataset.d};break}}
  const ws=new Date(visible.k+"T00:00:00");
  $("range").textContent=rangeText(ws);
  const tabs=$("tabs"),todayIso=iso(new Date());
  if(tabs.dataset.k!==visible.k){
    tabs.dataset.k=visible.k;tabs.textContent="";
    for(let i=0;i<7;i++){const d=addDays(ws,i),t=document.createElement("button");
      t.className="tab"+(iso(d)===todayIso?" today":"");t.innerHTML=`<span>${DAYS[i]}</span><b>${d.getDate()}</b>`;
      t.onclick=()=>scrollToDay(visible.k,i,null);tabs.append(t)}
  }
  [...tabs.children].forEach((t,i)=>t.classList.toggle("sel",i===visible.d));
}
function topOffset(){return $("top").offsetHeight}
function scrollToDay(k,d,min){
  const el=$(`d-${k}-${d}`);if(!el)return;
  const y=el.getBoundingClientRect().top+scrollY-topOffset()+(min==null?0:cssPx("--lab")+min/60*cssPx("--h"));
  scrollTo(0,Math.max(0,y));updateTop();
}
function scrollToNow(){
  const now=new Date(),m=now.getHours()*60+now.getMinutes();
  if(isDay()){if(!$(`d-${iso(monday(now))}-${(now.getDay()+6)%7}`)){rangeStart=addDays(monday(now),-7);rangeLen=3;render()}
    scrollToDay(iso(monday(now)),(now.getDay()+6)%7,Math.max(0,m-90))}
  else{const target=iso(weekStart)===iso(monday(now))?Math.max(0,m-120):7*60;
    const body=document.querySelector(".wk-body");if(!body)return;
    const head=document.querySelector(".wk-head").offsetHeight;
    scrollTo(0,body.getBoundingClientRect().top+scrollY-topOffset()-head+target/60*cssPx("--h"))}
}
function grow(){
  if(!uid||!isDay()||rangeLen>=40)return;
  const H=innerHeight,de=document.documentElement;
  if(scrollY+H>de.scrollHeight-2*H){rangeLen++;render()}
  else if(scrollY<2*H){const before=de.scrollHeight;rangeStart=addDays(rangeStart,-7);rangeLen++;render();scrollBy(0,de.scrollHeight-before)}
}
let sraf=0;addEventListener("scroll",()=>{if(!sraf)sraf=requestAnimationFrame(()=>{sraf=0;if(uid){updateTop();grow()}})},{passive:true});

/* ---------- editor ---------- */
const COLORS={white:"#f2f2f2",red:"#ff4d5e",orange:"#ff9a3d",yellow:"#ffd84d",green:"#3ddc84",cyan:"#3ad1ff",blue:"#5b8cff",violet:"#b06bff",pink:"#ff6bd6"};
const colorOf=k=>COLORS[k]||COLORS.white;
const WD=["Вс","Пн","Вт","Ср","Чт","Пт","Сб"];
const dateLabel=d=>`${WD[d.getDay()]}, ${d.getDate()} ${MON[d.getMonth()]}${d.getFullYear()!==new Date().getFullYear()?" "+d.getFullYear():""}`;
const dateText=d=>`${pad(d.getDate())}.${pad(d.getMonth()+1)}.${d.getFullYear()}`;
const dayOnly=d=>new Date(d.getFullYear(),d.getMonth(),d.getDate());
const durLabel=m=>m<60?`${m} мин`:(m%60?`${Math.floor(m/60)} ч ${m%60} мин`:`${m/60} ч`);
const PRESETS=[15,30,45,60,90,120,180];
function parseDate(s,fallback){
  const m=s.trim().match(/^(\d{1,2})[.\/\-\s](\d{1,2})(?:[.\/\-\s](\d{2,4}))?$/);if(!m)return null;
  let y=m[3]?+m[3]:fallback.getFullYear();if(y<100)y+=2000;
  const d=new Date(y,+m[2]-1,+m[1]);return d.getMonth()===+m[2]-1?d:null;
}
function parseTime(s){
  const t=s.trim().replace(/\s/g,"");let m=t.match(/^(\d{1,2})[:.,-](\d{1,2})$/)||t.match(/^(\d{1,2})(\d{2})$/)||t.match(/^(\d{1,2})$/);
  if(!m)return null;const h=+m[1],mi=m[2]==null?0:+m[2];return h<24&&mi<60?fmt(h*60+mi):null;
}
/* "90", "1:30", "1.5", "1ч 30м", "2 ч" → minutes */
function parseDur(s){
  const t=s.trim().toLowerCase().replace(",",".");let m;
  if((m=t.match(/^(\d{1,2}):(\d{1,2})$/)))return +m[1]*60+ +m[2];
  const h=t.match(/(\d+(?:\.\d+)?)\s*ч/),mi=t.match(/(\d+)\s*м/);
  if(h||mi)return Math.round((h?parseFloat(h[1])*60:0)+(mi?+mi[1]:0));
  if((m=t.match(/^\d+\.\d+$/)))return Math.round(parseFloat(t)*60);
  if((m=t.match(/^\d+$/)))return +t<=12?+t*60:+t;
  return null;
}
function defaultDate(){
  const today=dayOnly(new Date());
  if(isDay())return addDays(new Date(visible.k+"T00:00:00"),visible.d);
  return iso(monday(today))===iso(weekStart)?today:new Date(weekStart);
}
function nextSlot(){const n=new Date(),m=Math.min(1380,Math.ceil((n.getHours()*60+n.getMinutes()+1)/30)*30);return fmt(m)}

/* ---------- templates: users/{uid}/meta/templates ---------- */
let templates=[],tplUnsub=null,tplRef=null;
function watchTemplates(){
  tplRef=doc(fs,"users",uid,"meta","templates");
  tplUnsub=onSnapshot(tplRef,s=>{const d=s.exists()?s.data():null;templates=d&&Array.isArray(d.items)?d.items:[];
    if(window.__paintTpl)window.__paintTpl()});
}
function saveTemplates(){setDoc(tplRef,{items:templates}).catch(()=>setDot("off","Шаблон не сохранился"))}

/* one scroll-snap wheel; onPick(index) fires when it settles */
function makeWheel(items,idx,onPick,cls){
  const el=document.createElement("div");el.className="wheel"+(cls?" "+cls:"");
  items.forEach((t,i)=>{const it=document.createElement("div");it.textContent=t;it.onclick=()=>{el.scrollTop=i*36};el.append(it)});
  let tm=0;el.skip=false;
  el.addEventListener("scroll",()=>{clearTimeout(tm);tm=setTimeout(()=>{
    if(el.skip){el.skip=false;return}
    onPick(Math.max(0,Math.min(items.length-1,Math.round(el.scrollTop/36))))},90)},{passive:true});
  el.set=i=>{const t=i*36;if(Math.abs(el.scrollTop-t)>1){el.skip=true;el.scrollTop=t}};
  requestAnimationFrame(()=>el.set(idx));
  return el;
}

function openEditor(e,w,wStart,day,s0,e0,P={}){
  const isNew=!e;
  const st={
    title:e?e.title:(P.title||""),
    color:e&&e.color?e.color:(P.color||"white"),
    date:dayOnly(wStart?addDays(wStart,e?e.day:day):defaultDate()),
    allDay:e?!e.start:!!P.allDay,
    start:(e&&e.start)||s0||nextSlot(),
    dur:60,
    keep:false
  };
  const endSrc=(e&&e.end)||e0;
  if(endSrc){const d=toMin(endSrc)-toMin(st.start);if(d>0)st.dur=d}
  let active="start";
  const m=$("modal");
  m.innerHTML=`<div class="back" id="bk"><form class="sheet" id="f" autocomplete="off">
    ${isNew?`<div class="tpls" id="f-tpls"></div>`:""}
    <input id="f-title" maxlength="120" placeholder="Что делаем" aria-label="Название">
    <div class="colors" id="f-colors">${Object.entries(COLORS).map(([k,c])=>`<button type="button" class="cl" data-k="${k}" style="--c:${c}" aria-label="Цвет"></button>`).join("")}</div>
    <label class="fld"><span>Дата</span><input id="f-date" readonly inputmode="numeric" aria-label="Дата"></label>
    <label class="sw">Без времени<input type="checkbox" id="f-all"></label>
    <div id="f-timed">
      <div class="row">
        <label class="fld"><span>Начало</span><input id="f-start" readonly inputmode="numeric" aria-label="Начало"></label>
        <label class="fld"><span>Длительность</span><input id="f-dur" readonly inputmode="numeric" aria-label="Длительность"></label>
      </div>
      <div class="ends" id="f-ends"></div>
    </div>
    <div class="presets" id="f-presets">${PRESETS.map(p=>`<button type="button" class="ps" data-m="${p}">${durLabel(p).replace(" мин","м").replace(" ч","ч").replace(" ","")}</button>`).join("")}</div>
    <div class="picker" id="f-pick"></div>
    <div class="hint">Нажмите на поле ещё раз, чтобы ввести вручную.</div>
    <label class="sw">Сохранить как шаблон<input type="checkbox" id="f-keep"></label>
    <div class="acts">
      <button type="button" class="link" id="f-cancel">Отмена</button>
      ${isNew?"":`<button type="button" class="link" id="f-del">Удалить</button>`}
      <button type="submit" class="save">${isNew?"Добавить":"Сохранить"}</button>
    </div>
  </form></div>`;
  const F={date:$("f-date"),start:$("f-start"),dur:$("f-dur")};
  $("f-title").value=st.title;$("f-all").checked=st.allDay;
  if(!isNew)st.keep=templates.some(t=>t.title.toLowerCase()===st.title.toLowerCase());
  $("f-keep").checked=st.keep;

  function show(){
    if(F.date.readOnly)F.date.value=dateLabel(st.date);
    if(F.start.readOnly)F.start.value=st.start;
    if(F.dur.readOnly)F.dur.value=durLabel(st.dur);
    const end=Math.min(1440,toMin(st.start)+st.dur);
    $("f-ends").textContent=end>=1440?"до конца дня":`до ${fmt(end)}`;
    $("f-timed").hidden=st.allDay;
    if(st.allDay&&active!=="date")active="date";
    $("f-presets").hidden=active!=="dur";
    $("f-presets").querySelectorAll(".ps").forEach(b=>b.classList.toggle("on",+b.dataset.m===st.dur));
    Object.entries(F).forEach(([k,el])=>el.classList.toggle("act",k===active));
    m.querySelectorAll(".cl").forEach(b=>b.classList.toggle("on",b.dataset.k===st.color));
    $("f-title").style.setProperty("--c",colorOf(st.color));
  }
  function buildPicker(){
    const p=$("f-pick");p.textContent="";
    if(active==="date"){
      const today=dayOnly(new Date()),base=addDays(today,-60);
      const n=Math.max(426,Math.round((st.date-base)/864e5)+30);
      const days=[];for(let i=0;i<n;i++)days.push(addDays(base,i));
      let idx=Math.round((dayOnly(st.date)-base)/864e5);
      if(idx<0){days.unshift(...Array.from({length:-idx},(_,i)=>addDays(st.date,i)));idx=0}
      p.append(makeWheel(days.map(dateLabel),idx,i=>{st.date=days[i];show()}));
    }else if(active==="start"){
      const cur=toMin(st.start);let hh=Math.floor(cur/60),mm=cur%60;
      const mins=Array.from({length:12},(_,i)=>i*5);
      const apply=()=>{st.start=fmt(hh*60+mm);show()};
      const c=document.createElement("span");c.className="colon";c.textContent=":";
      p.append(makeWheel(Array.from({length:24},(_,i)=>pad(i)),hh,i=>{hh=i;apply()},"h"),c,
               makeWheel(mins.map(pad),Math.round(mm/5)%12,i=>{mm=mins[i];apply()},"m"));
    }else{
      let hh=Math.min(12,Math.floor(st.dur/60)),mm=st.dur%60;
      const mins=Array.from({length:12},(_,i)=>i*5);
      const apply=()=>{st.dur=Math.max(5,hh*60+mm);show()};
      const lh=document.createElement("span");lh.className="colon";lh.textContent="ч";
      const lm=document.createElement("span");lm.className="colon";lm.textContent="мин";
      p.append(makeWheel(Array.from({length:13},(_,i)=>String(i)),hh,i=>{hh=i;apply()},"h"),lh,
               makeWheel(mins.map(pad),Math.round(mm/5)%12,i=>{mm=mins[i];apply()},"m"),lm);
    }
  }
  /* first tap on a field = its wheel, second tap = keyboard */
  Object.entries(F).forEach(([k,el])=>{
    el.addEventListener("click",ev=>{
      if(active!==k){ev.preventDefault();active=k;show();buildPicker();return}
      if(el.readOnly){el.readOnly=false;el.value=k==="date"?dateText(st.date):k==="dur"?String(st.dur):st[k];el.focus();el.select()}
    });
    el.addEventListener("blur",()=>commit(k));
    el.addEventListener("keydown",ev=>{if(ev.key==="Enter"){ev.preventDefault();el.blur()}});
  });
  function commit(k){
    const el=F[k];if(el.readOnly)return;
    if(k==="date"){const d=parseDate(el.value,st.date);if(d)st.date=d}
    else if(k==="start"){const v=parseTime(el.value);if(v)st.start=v}
    else{const d=parseDur(el.value);if(d&&d>0)st.dur=Math.min(1440,d)}
    el.readOnly=true;show();buildPicker();
  }
  $("f-presets").onclick=ev=>{const b=ev.target.closest(".ps");if(!b)return;st.dur=+b.dataset.m;show();buildPicker()};
  $("f-colors").onclick=ev=>{const b=ev.target.closest(".cl");if(!b)return;st.color=b.dataset.k;show()};
  $("f-all").onchange=ev=>{st.allDay=ev.target.checked;active=st.allDay?"date":"start";show();buildPicker()};
  $("f-keep").onchange=ev=>{st.keep=ev.target.checked};

  /* template chips: tap = fill, × twice = delete */
  function paintTpl(){
    const box=$("f-tpls");if(!box)return;box.textContent="";
    box.hidden=!templates.length;
    for(const t of templates){
      const b=document.createElement("button");b.type="button";b.className="tp";b.style.setProperty("--c",colorOf(t.color));
      const n=document.createElement("span");n.textContent=t.title;
      const x=document.createElement("span");x.className="x";x.textContent="×";x.setAttribute("aria-label","Удалить шаблон");
      b.append(n,x);
      b.onclick=ev=>{
        if(ev.target===x){
          if(!x.classList.contains("armed")){x.classList.add("armed");x.textContent="удалить?";return}
          templates=templates.filter(y=>y.id!==t.id);saveTemplates();paintTpl();return;
        }
        st.title=t.title;st.color=t.color||"white";st.dur=t.dur||60;st.allDay=!!t.allDay;st.keep=true;
        $("f-title").value=st.title;$("f-all").checked=st.allDay;$("f-keep").checked=true;
        active=st.allDay?"date":"start";show();buildPicker();
      };
      box.append(b);
    }
  }
  window.__paintTpl=paintTpl;paintTpl();

  const close=()=>{m.innerHTML="";window.__paintTpl=null};
  $("f-cancel").onclick=close;
  $("bk").onclick=ev=>{if(ev.target.id==="bk")close()};
  if(!isNew){let armed=false;$("f-del").onclick=()=>{
    if(!armed){armed=true;$("f-del").textContent="Точно?";return}
    w.events=w.events.filter(x=>x.id!==e.id);save(w);render();close()}}
  $("f").onsubmit=ev=>{ev.preventDefault();
    Object.keys(F).forEach(commit);
    const title=$("f-title").value.trim();if(!title){$("f-title").focus();return}
    const end=Math.min(1439,toMin(st.start)+st.dur);
    const tw=week(monday(st.date));
    const item={id:e?e.id:Math.random().toString(36).slice(2,10),title,color:st.color,day:(st.date.getDay()+6)%7,
      start:st.allDay?"":st.start,end:st.allDay?"":fmt(end),done:e?!!e.done:false};
    if(e&&w.k!==tw.k){w.events=w.events.filter(x=>x.id!==e.id);save(w)}
    if(e&&w.k===tw.k){w.events=w.events.map(x=>x.id===e.id?item:x);save(w)}
    else if(tw.loaded){tw.events.push(item);save(tw)}
    else{setDoc(tw.ref,{events:arrayUnion(item),updatedAt:new Date().toISOString()},{merge:true}).catch(()=>setDot("off","Не сохранилось"))}
    /* template: everything except date and time */
    const same=t=>t.title.toLowerCase()===title.toLowerCase();
    if(st.keep){
      const t={id:(templates.find(same)||{}).id||Math.random().toString(36).slice(2,10),title,color:st.color,dur:st.dur,allDay:st.allDay};
      templates=templates.some(same)?templates.map(x=>same(x)?t:x):[...templates,t];saveTemplates();
    }else if(!isNew&&templates.some(same)){templates=templates.filter(x=>!same(x));saveTemplates()}
    render();close();
    if(isDay())requestAnimationFrame(()=>scrollToDay(tw.k,item.day,item.start?Math.max(0,toMin(item.start)-60):null));
  };
  show();buildPicker();
  if(isNew&&!templates.length)setTimeout(()=>$("f-title").focus(),30);
}
document.addEventListener("keydown",k=>{if(k.key==="Escape"){$("modal").innerHTML="";window.__paintTpl=null}});

/* ---------- quick add: Russian free-text → event ---------- */
const NUMW={"ноль":0,"один":1,"одну":1,"одного":1,"два":2,"две":2,"двух":2,"три":3,"трех":3,"четыре":4,"четырех":4,"пять":5,"пяти":5,"шесть":6,"шести":6,"семь":7,"семи":7,"восемь":8,"восьми":8,"девять":9,"девяти":9,"десять":10,"десяти":10,"одиннадцать":11,"одиннадцати":11,"двенадцать":12,"двенадцати":12,"тринадцать":13,"четырнадцать":14,"пятнадцать":15,"шестнадцать":16,"семнадцать":17,"восемнадцать":18,"девятнадцать":19,"двадцать":20,"тридцать":30,"сорок":40,"пятьдесят":50};
const ORDW={"первого":1,"второго":2,"третьего":3,"четвертого":4,"пятого":5,"шестого":6,"седьмого":7,"восьмого":8,"девятого":9,"десятого":10,"одиннадцатого":11,"двенадцатого":12};
const MONW=[/^янв/,/^фев/,/^мар/,/^апр/,/^ма[яй]/,/^июн/,/^июл/,/^авг/,/^сен/,/^окт/,/^ноя/,/^дек/];
const WDW=[["понедельник","пн"],["вторник","вт"],["сред","ср"],["четверг","чт"],["пятниц","пт"],["суббот","сб"],["воскресень","вс"]];

function wordsToDigits(t){
  /* "двадцать пять" → "25", "пять" → "5"; "полпятого" → "4:30" */
  t=t.replace(/(?:^|\s)(?:в\s+)?(?:пол|половине\s+)([а-я]+ого)(?=\s|$)/g,(m,w)=>ORDW[w]!=null?` в ${ORDW[w]-1||12}:30`:m);
  const parts=t.split(/\s+/),out=[];
  for(let i=0;i<parts.length;i++){
    const w=parts[i];
    if(NUMW[w]!=null){
      let v=NUMW[w];
      if(v>=20&&v%10===0&&NUMW[parts[i+1]]!=null&&NUMW[parts[i+1]]<10){v+=NUMW[parts[i+1]];i++}
      out.push(String(v));
    }else out.push(w);
  }
  return out.join(" ");
}

function parseQuick(raw,now=new Date()){
  let t=" "+raw.toLowerCase().replace(/ё/g,"е").replace(/[,!?;]/g," ").replace(/\s+/g," ").trim()+" ";
  /* spoken lead-ins: "добавь", "поставь мне", "прошу записать", "пожалуйста" … */
  const LEAD=/^(?:пожалуйста|плиз|прошу|можешь|можно|давай|ну|так|ок|окей|слушай|мне|себе|еще|ещё|пж|добавь|добавить|добавляй|поставь|поставить|поставьте|запиши|записать|запишите|внеси|внести|создай|создать|сделай|назначь|назначить|запланируй|запланировать|напиши|отметь|занеси|забей|кинь|закинь|новое|новую|дело|событие|встречу)\s+/;
  t=t.trim();let lead=false;for(let k=0;k<6;k++){const n=t.replace(LEAD,"");if(n===t||!n.trim())break;t=n;lead=true}
  /* after "добавь …" the noun comes in accusative: "математику" → "математика", "лекцию" → "лекция" */
  t=" "+t+" ";
  t=t.replace(/\sпожалуйста(?=\s|$)/g," ");
  t=" "+wordsToDigits(t.trim())+" ";
  const cut=re=>{const m=t.match(re);if(m)t=t.replace(m[0]," | ");return m};
  const today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  let dur=null,date=null,hh=null,mm=0,m;

  /* duration as one word: "четырехчасовой", "2-часовая", "получасовой", "сорокапятиминутная" */
  const PRE={"":1,"одно":1,"двух":2,"трех":3,"четырех":4,"пяти":5,"шести":6,"семи":7,"восьми":8,"девяти":9,"десяти":10,"одиннадцати":11,"двенадцати":12,"полутора":1.5,"полу":0.5,
    "пятнадцати":15,"двадцати":20,"тридцати":30,"сорока":40,"сорокапяти":45,"пятидесяти":50,"девяноста":90};
  if((m=t.match(/\s(?:(\d+)-?|([а-я]*?))(часов|минутн)(?:ой|ая|ое|ую|ый|ые|ого|ых)\s/))&&(m[1]||PRE[m[2]]!=null)){
    const n=m[1]?+m[1]:PRE[m[2]];
    t=t.replace(m[0]," | ");dur=Math.round(m[3]==="часов"?n*60:n);
  }
  /* duration */
  if(dur!=null){}
  else if(cut(/\s(?:на\s)?полтора\sчаса\s/))dur=90;
  else if(cut(/\s(?:на\s)?полчаса\s/))dur=30;
  else if((m=t.match(/(?<!\s(?:в|во|к|с))\s(?:на\s)?(\d+(?:[.,]\d+)?)\s?(?:ч|час|часа|часов)(?:\s(\d+)\s?(?:м|мин|минут|минуты))?\s(?!(?:утра|дня|вечера|ночи)\s)/))
          &&parseFloat(m[1].replace(",","."))<=12){
    /* "на 2 часа" is a duration; "на 16 часов" / "на 10 часов утра" stay for the time rule */
    t=t.replace(m[0]," | ");dur=Math.round(parseFloat(m[1].replace(",","."))*60)+(m[2]?+m[2]:0);
  }
  else if((m=cut(/\s(?:на\s)?(\d+)\s?(?:м|мин|минут|минуты|минуту)\s/)))dur=+m[1];
  else if(cut(/\sна\sчас\s/))dur=60;

  /* date */
  if(cut(/\sпослезавтра\s/))date=addDays(today,2);
  else if(cut(/\sзавтра\s/))date=addDays(today,1);
  else if(cut(/\sсегодня\s/))date=today;
  else if((m=cut(/\sчерез\s(\d+)\s(?:день|дня|дней)\s/)))date=addDays(today,+m[1]);
  else if(cut(/\sчерез\sнеделю\s/))date=addDays(today,7);
  else if((m=cut(/\s(\d{1,2})[.\/](\d{1,2})(?:[.\/](\d{2,4}))?\s/))){
    let y=m[3]?+m[3]:today.getFullYear();if(y<100)y+=2000;date=new Date(y,+m[2]-1,+m[1]);
    if(!m[3]&&date<today)date.setFullYear(y+1);
  }else if((m=t.match(/\s(\d{1,2})(?:-?го)?\s([а-я]+)\s/))&&MONW.some(r=>r.test(m[2]))){
    t=t.replace(m[0]," | ");const mo=MONW.findIndex(r=>r.test(m[2]));
    date=new Date(today.getFullYear(),mo,+m[1]);if(date<today)date.setFullYear(today.getFullYear()+1);
  }else if((m=cut(/\s(?:на\s|к\s)?(\d{1,2})(?:-?го|-?е)?\sчисла\s/))){
    date=new Date(today.getFullYear(),today.getMonth(),+m[1]);if(date<today)date.setMonth(date.getMonth()+1);
  }else{
    for(let d=0;d<7;d++){
      const [full,short]=WDW[d];
      const re=new RegExp(`\\s(?:(?:в|во|на|к)\\s)?(?:(следующ[а-я]*|этот|эту|это)\\s)?(?:${full}[а-я]*|${short})\\s`);
      if((m=cut(re))){
        const cur=(today.getDay()+6)%7;let add=(d-cur+7)%7;
        if(m[1]&&m[1].startsWith("следующ"))add+=add===0?7:7;
        date=addDays(today,add);break;
      }
    }
  }

  /* time */
  const sfx="(утра|дня|вечера|ночи)";
  if(cut(/\s(?:в\s|на\s|к\s)?полдень\s/)){hh=12}
  else if(cut(/\s(?:в\s|на\s|к\s)?полночь\s/)){hh=0}
  else if((m=cut(new RegExp(`\\s(?:в\\s|на\\s|к\\s|с\\s)?(\\d{1,2})[:.](\\d{2})(?:\\s${sfx})?\\s`)))||
          (m=cut(new RegExp(`\\s(?:в\\s|на\\s|к\\s|с\\s)?([01]?\\d|2[0-3])\\s([0-5]\\d)(?:\\s${sfx})?\\s`)))){
    hh=+m[1];mm=+m[2];if(m[3])hh=applySfx(hh,m[3]);
  }else if((m=cut(new RegExp(`\\s(?:в\\s|на\\s|к\\s|с\\s)(?:(\\d{1,2})|час)(?:\\s(?:час|часа|часов|ч))?(?:\\s${sfx})?\\s`)))){
    hh=m[1]!=null?+m[1]:1;
    if(m[2])hh=applySfx(hh,m[2]);else if(hh>=1&&hh<=6)hh+=12;
  }else if((m=cut(new RegExp(`\\s(\\d{1,2})\\s${sfx}\\s`)))){hh=applySfx(+m[1],m[2])}
  if(hh!=null&&(hh>23||mm>59))hh=null;

  /* title = what is left */
  /* drop little words that belonged to a removed part ("на |", "в |") and stray "|" */
  const FILL="(?:на|в|во|к|с|до|и|числа)";
  for(let k=0;k<3;k++)t=t.replace(new RegExp(`\\s${FILL}\\s(?=\\|)`,"g")," ").replace(new RegExp(`\\|\\s${FILL}\\s(?=\\||$)`,"g"),"| ");
  let title=t.replace(/\|/g," ").replace(/\s+/g," ").trim().replace(new RegExp(`^${FILL}\\s|\\s${FILL}$`,"g"),"").trim();
  if(lead)title=title.replace(/^([а-я]{3,}[^аеиоуыэюя\s])у(?=\s|$)/,"$1а").replace(/^([а-я]{3,}[иь])ю(?=\s|$)/,"$1я");
  /* restore the user's own capital letters */
  const orig=raw.trim().split(/\s+/);
  title=title.split(" ").map(w=>orig.find(o=>o.toLowerCase().replace(/ё/g,"е").replace(/[,!?;]/g,"")===w)?.replace(/[,!?;]/g,"")||w).join(" ");
  title=title?title[0].toUpperCase()+title.slice(1):"";
  return {title,date:date||today,start:hh==null?null:fmt(hh*60+mm),dur};
}
function applySfx(h,s){
  if(s==="утра")return h===12?0:h;
  if(s==="дня")return h<12&&h<=6?h+12:h;
  if(s==="вечера")return h<12?h+12:h;
  if(s==="ночи")return h===12?0:h;
  return h;
}

function quickParse(){
  const v=$("q").value.trim();if(!v)return null;
  const r=parseQuick(v);if(!r.title)return null;
  const tpl=templates.find(t=>t.title.toLowerCase()===r.title.toLowerCase());
  const allDay=r.start==null;
  const dur=r.dur??tpl?.dur??60;
  return {title:tpl?tpl.title:r.title,date:r.date,start:r.start,dur,allDay,color:tpl?.color||"white"};
}
function quickPreview(){
  const p=quickParse(),el=$("q-prev");
  $("q-go").hidden=!p;el.hidden=!p;if(!p)return;
  const time=p.allDay?"без времени":`${p.start}–${fmt(Math.min(1439,toMin(p.start)+p.dur))}`;
  el.innerHTML="";const dot=document.createElement("i");dot.style.background=colorOf(p.color);
  el.append(dot,document.createTextNode(`${p.title} · ${dateLabel(p.date)} · ${time}`));
  const hint=document.createElement("span");hint.textContent="изменить";el.append(hint);
}
const _qp=quickPreview;quickPreview=function(){_qp();document.documentElement.style.setProperty("--topH",$("top").offsetHeight+"px")};
function addItem(date,item){
  const tw=week(monday(date));
  if(tw.loaded){tw.events.push(item);save(tw)}
  else setDoc(tw.ref,{events:arrayUnion(item),updatedAt:new Date().toISOString()},{merge:true}).catch(()=>setDot("off","Не сохранилось"));
  return tw;
}
function showAdded(p,date){
  if(!isDay()&&iso(monday(date))!==iso(weekStart)){weekStart=monday(date)}
  render();
  requestAnimationFrame(()=>{
    if(isDay()){
      const k=iso(monday(date)),d=(date.getDay()+6)%7;
      if(!$(`d-${k}-${d}`)){rangeStart=addDays(monday(date),-7);rangeLen=3;render()}
      scrollToDay(k,d,p.start?Math.max(0,toMin(p.start)-60):null);
    }
  });
}
$("q").addEventListener("input",quickPreview);
$("qf").onsubmit=ev=>{ev.preventDefault();
  const p=quickParse();if(!p)return;
  const end=Math.min(1439,toMin(p.start||"00:00")+p.dur);
  const item={id:Math.random().toString(36).slice(2,10),title:p.title,color:p.color,day:(p.date.getDay()+6)%7,
    start:p.allDay?"":p.start,end:p.allDay?"":fmt(end),done:false};
  addItem(p.date,item);
  $("q").value="";quickPreview();$("q").blur();showAdded(p,p.date);
};
$("q-prev").onclick=()=>{
  const p=quickParse();if(!p)return;
  const ws=monday(p.date),day=(p.date.getDay()+6)%7;
  const s0=p.start||null,e0=p.start?fmt(Math.min(1439,toMin(p.start)+p.dur)):null;
  $("q").value="";quickPreview();$("q").blur();
  openEditor(null,null,ws,day,s0,e0,{title:p.title,color:p.color,allDay:p.allDay});
};

/* voice input: Safari / Chrome speech recognition → the quick-add line */
(()=>{
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition,btn=$("q-mic");
  let rec=null;
  const note=t=>{const el=$("q-prev");el.hidden=false;el.textContent=t;document.documentElement.style.setProperty("--topH",$("top").offsetHeight+"px")};
  btn.onclick=()=>{
    if(rec){rec.stop();return}
    if(!SR){$("q").focus();note("Здесь нет встроенного распознавания. Нажмите микрофон на клавиатуре и продиктуйте.");return}
    try{rec=new SR()}catch(e){rec=null;$("q").focus();note("Нажмите микрофон на клавиатуре и продиктуйте.");return}
    rec.lang="ru-RU";rec.interimResults=true;rec.continuous=false;rec.maxAlternatives=1;
    const before=$("q").value.trim();
    rec.onresult=ev=>{let t="";for(const r of ev.results)t+=r[0].transcript;$("q").value=(before?before+" ":"")+t.trim();quickPreview()};
    rec.onerror=ev=>{
      if(ev.error==="not-allowed"||ev.error==="service-not-allowed")note("Нет доступа к микрофону. Разрешите его в настройках или продиктуйте через клавиатуру.");
      else if(ev.error==="no-speech")note("Ничего не услышал, попробуйте ещё раз.");
      else if(ev.error!=="aborted")note(navigator.onLine?"Не получилось распознать, попробуйте ещё раз.":"Для голосового ввода нужен интернет.");
    };
    rec.onend=()=>{rec=null;btn.classList.remove("on");if($("q").value.trim())quickPreview()};
    btn.classList.add("on");
    try{rec.start()}catch(e){rec=null;btn.classList.remove("on")}
  };
})();

/* ---------- navigation ---------- */
function go(delta){
  if(isDay()){
    if(delta===0)return scrollToNow();
    /* step one day, keep the same time of day on screen */
    const cur=$(`d-${visible.k}-${visible.d}`);
    const off=cur?topOffset()-cur.getBoundingClientRect().top:0;
    const target=addDays(new Date(visible.k+"T00:00:00"),visible.d+delta),de=document.documentElement;
    while(target<rangeStart){const before=de.scrollHeight;rangeStart=addDays(rangeStart,-7);rangeLen++;render();scrollBy(0,de.scrollHeight-before)}
    while(addDays(rangeStart,rangeLen*7)<=target){rangeLen++;render()}
    const el=$(`d-${iso(monday(target))}-${(target.getDay()+6)%7}`);if(!el)return;
    scrollTo(0,Math.max(0,el.getBoundingClientRect().top+scrollY-topOffset()+off));updateTop();
  }else{
    weekStart=delta===0?monday(new Date()):addDays(weekStart,7*delta);
    render();scrollToNow();
  }
}
function setMode(m){
  if(m!==mode){
    if(m==="week"){weekStart=new Date(visible.k+"T00:00:00")}
    else{
      const t=monday(new Date()),thisWeek=iso(weekStart)===iso(t);
      rangeStart=addDays(weekStart,-7);rangeLen=3;
      visible={k:iso(weekStart),d:thisWeek?(new Date().getDay()+6)%7:0};
    }
    mode=m;try{localStorage.setItem("viewMode",m)}catch(e){}
  }
  document.body.classList.toggle("daymode",isDay());
  $("seg").querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.m===mode));
  $("tabs").dataset.k="";
  if(!uid)return;
  render();
  requestAnimationFrame(()=>{
    const thisWeek=iso(isDay()?new Date(visible.k+"T00:00:00"):weekStart)===iso(monday(new Date()));
    if(thisWeek)scrollToNow();else if(isDay())scrollToDay(visible.k,visible.d,7*60);else scrollToNow();
  });
}
$("seg").onclick=ev=>{const b=ev.target.closest("button");if(b)setMode(b.dataset.m)};
$("prev").onclick=()=>go(-1);$("next").onclick=()=>go(1);$("now").onclick=()=>go(0);
mq.addEventListener("change",()=>{if(uid){render();scrollToNow()}});
setMode(mode);
setInterval(()=>uid&&render(),60000);

  try{await signInWithEmailAndPassword(auth,$("l-email").value.trim(),$("l-pass").value)}
  catch(e){$("l-err").textContent=navigator.onLine?"Неверная почта или пароль":"Для первого входа нужен интернет"}};

});

/* ---------- offline copy + auto-update ---------- */
const BUILD="20261005223902";
async function checkVersion(){
  if(!navigator.onLine)return;
  try{const r=await fetch("version.txt?t="+Date.now(),{cache:"no-store"});if(!r.ok)return;
    const v=(await r.text()).trim();if(v&&v!==BUILD&&!$("modal").children.length)location.reload()}catch(e){}
}
document.addEventListener("visibilitychange",()=>{if(!document.hidden)checkVersion()});
addEventListener("online",checkVersion);
setTimeout(checkVersion,3000);
if("serviceWorker" in navigator){
  let reloaded=false;const had=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener("controllerchange",()=>{if(had&&!reloaded){reloaded=true;location.reload()}});
  navigator.serviceWorker.register("sw.js").then(r=>{r.update();document.addEventListener("visibilitychange",()=>{if(!document.hidden)r.update()})});
}
